<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Test — Physics Project – B</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0b1020; color:#e8edf7; padding:24px; }
  .box { width:100%; max-width:640px; background:#131a30; border:1px solid #22304f;
         border-radius:14px; padding:28px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .ok { color:#33d6a6; }
  p { color:#9aa8c4; margin:0 0 18px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; margin:0; font-size:.9rem; }
  dt { color:#9aa8c4; }
  dd { margin:0; font-family: ui-monospace, Menlo, Consolas, monospace; word-break:break-all; }
  a { color:#5b8cff; }
  .foot { margin-top:22px; font-size:.85rem; color:#9aa8c4; }
</style>
</head>
<body>
  <div class="box">
    <h1><span class="ok">&#10003;</span> Deployment test</h1>
    <p>If you can read this, static assets are being served correctly.</p>
    <dl>
      <dt>Page</dt><dd id="url">—</dd>
      <dt>Loaded at</dt><dd id="time">—</dd>
      <dt>Viewport</dt><dd id="vp">—</dd>
      <dt>User agent</dt><dd id="ua">—</dd>
    </dl>
    <div class="foot"><a href="/">Back to the project page</a></div>
  </div>
<script>
  document.getElementById('url').textContent = location.href;
  document.getElementById('time').textContent = new Date().toString();
  document.getElementById('vp').textContent = innerWidth + ' × ' + innerHeight + ' @ ' + (devicePixelRatio || 1) + 'x';
  document.getElementById('ua').textContent = navigator.userAgent;
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
      .catch(function () {});
  });
}
</script>
</body>
</html>
